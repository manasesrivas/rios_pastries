{% extends 'base.html' %}

{% block title %}
    Acceso denegado
{% endblock %}


{% block content %}
    <section class="relative isolate flex min-h-[70vh] items-center justify-center overflow-hidden px-4 py-16 sm:px-6">
        <div aria-hidden="true" class="absolute inset-0 -z-10 overflow-hidden">
            <div class="absolute -left-20 top-10 h-64 w-64 rounded-full bg-indigo-200/50 blur-3xl"></div>
            <div class="absolute -right-16 bottom-0 h-72 w-72 rounded-full bg-rose-200/40 blur-3xl"></div>
        </div>

        <div class="w-full max-w-xl rounded-3xl border border-white/80 bg-white/90 p-8 text-center shadow-2xl shadow-indigo-950/10 backdrop-blur sm:p-12">
            <div class="mx-auto flex h-20 w-20 items-center justify-center rounded-2xl bg-rose-50 text-rose-600 ring-1 ring-rose-100">
                <svg class="h-10 w-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9.3 3.75L13.8 3.75a2.08 2.08 0 0 0-3.6 0L2.7 16.5a2.08 2.08 0 0 0 1.8 3.12h15a2.08 2.08 0 0 0 1.8-3.12ZM12 16.5h.008v.008H12V16.5Z" />
                </svg>
            </div>

            <p class="mt-7 text-sm font-bold uppercase tracking-[0.25em] text-indigo-600">
                Error 403
            </p>
            <h1 class="mt-3 text-3xl font-black tracking-tight text-gray-900 sm:text-4xl">
                Alto ahí, esta zona es privada
            </h1>
            <p class="mx-auto mt-4 max-w-md text-base leading-7 text-gray-600">
                Tu cuenta no tiene permiso para ver esta página. Si crees que esto es un error, consulta con el administrador.
            </p>

            <a href="{% url 'users:home' %}" onclick="if (window.history.length > 1) { window.history.back(); return false; }" class="mt-8 inline-flex items-center justify-center gap-2 rounded-xl bg-indigo-600 px-6 py-3 text-sm font-semibold text-white shadow-lg shadow-indigo-600/20 transition hover:-translate-y-0.5 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m9 18-6-6 6-6m-6 6h18" />
                </svg>
                Volver a la página anterior
            </a>
        </div>
    </section>
{% endblock %}
