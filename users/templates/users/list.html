{% extends "base.html" %}
{% block content %}

{% include 'menu.html' %}
<ul>
    <li>
        <a href="{% url 'users:createUser' %}">crear usuario</a>
    </li>
</ul>
<ul>
    {% for user in object_list %}
    <a href="{% url 'users:updateUser' user.id %}">
        <li class="list-li">
            <p>
                {{ user.nombres }}
            </p>
            <h4>
                {{ user.email }}
            </h4>
            <p>{{ user.rol }}</p>
        </li>
    </a>
    {% empty %}
    <h3>
        sin usuarios listos
    </h3>
    {% endfor %}
</ul>
<style>
    .list-li{
        background: gray;
    }
</style>
{% endblock %}
