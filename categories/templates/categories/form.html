{% extends 'base.html' %}

{% block content  %}
<h1>
    {% if object %}
        Editar categoría
    {% else %}
        Crear categoría
    {% endif %}
</h1>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Guardar</button>
</form>

<a href="{% url 'categories:list' %}">
    Cancelar
</a>
{% endblock %}
