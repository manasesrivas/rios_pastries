{% extends 'base.html' %}

{% block content %}
    {% include 'menu.html' %}
    <a href="{% url 'venues:create' %}">crear local</a>
    {% for venue in venues %}
        <a href="{% url 'venues:detail' venue.pk %}">ver</a>
        {{ venue.name }}
        {{ venue.descripcion }}
        {{ venue.capacity }}
    {% empty %}
    <p>no hay salas registradas</p>
    {% endfor %}
{% endblock %}
