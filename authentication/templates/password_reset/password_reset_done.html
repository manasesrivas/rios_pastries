{% extends 'base.html' %}

{% block content %}
<div class="mx-auto max-w-md px-4 py-12">
  <div class="rounded-2xl border border-gray-200 bg-white p-8 text-center shadow-sm dark:border-gray-700 dark:bg-gray-800">
    <h1 class="text-2xl font-semibold text-gray-900 dark:text-white">
      Revisa tu correo
    </h1>
    <p class="mt-3 text-sm text-gray-600 dark:text-gray-400">
      Si existe una cuenta activa con ese correo, te enviamos un enlace para restablecer tu contraseña.
    </p>
    <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">
      Si no te llega en unos minutos, revisa la carpeta de spam.
    </p>
  </div>
</div>
{% endblock %}
