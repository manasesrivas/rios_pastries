{% extends 'base.html' %}

{% block content %}
<div class="mx-auto max-w-md px-4 py-12">
  <div class="rounded-2xl border border-gray-200 bg-white p-8 text-center shadow-sm dark:border-gray-700 dark:bg-gray-800">
    <h1 class="text-2xl font-semibold text-gray-900 dark:text-white">
      Contraseña actualizada
    </h1>
    <p class="mt-3 text-sm text-gray-600 dark:text-gray-400">
      Ya puedes iniciar sesión con tu nueva contraseña.
    </p>
    <a href="{% url 'authentication:login' %}"
       class="mt-6 inline-flex min-h-11 w-full items-center justify-center rounded-xl bg-indigo-600 px-4 font-medium text-white hover:bg-indigo-700">
      Ir a iniciar sesión
    </a>
  </div>
</div>
{% endblock %}
