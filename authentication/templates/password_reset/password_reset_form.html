{% extends 'base.html' %}

{% block content %}
<div class="mx-auto max-w-md px-4 py-12">
  <div class="rounded-2xl border border-gray-200 bg-white p-8 shadow-sm dark:border-gray-700 dark:bg-gray-800">
    <h1 class="text-2xl font-semibold text-gray-900 dark:text-white">
      Recuperar contraseña
    </h1>
    <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">
      Escribe tu correo y te enviaremos un enlace para elegir una nueva contraseña.
    </p>

    <form method="post" class="mt-6 space-y-4">
      {% csrf_token %}

      <div>
        <label for="id_email" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
          Correo electrónico
        </label>
        <input type="email" name="email" id="id_email" required autofocus
               class="mt-1 block w-full rounded-xl border border-gray-300 bg-white px-3 py-2 text-gray-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/40 dark:border-gray-600 dark:bg-gray-900 dark:text-white">
        {% for error in form.email.errors %}
          <p class="mt-1 text-sm text-red-600 dark:text-red-400">{{ error }}</p>
        {% endfor %}
        <a href="{% url 'authentication:login' %}"
            class="font-semibold text-indigo-600 hover:text-indigo-500">
            Ir a iniciar sesion
        </a>
      </div>

      <button type="submit"
              class="min-h-11 w-full rounded-xl bg-indigo-600 px-4 font-medium text-white hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500/40">
        Enviar enlace
      </button>
    </form>
  </div>
</div>
{% endblock %}
