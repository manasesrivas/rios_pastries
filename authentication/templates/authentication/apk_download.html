{% extends 'base.html' %}

{% block title %}Aplicación Android | Ríos Pastries{% endblock %}

{% block content %}
<section class="mx-auto w-full max-w-xl px-4 py-12">
    <div class="rounded-2xl bg-white p-8 shadow-xl ring-1 ring-gray-200 dark:bg-gray-900 dark:ring-gray-700">
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Aplicación Android</h1>
        {% if apk_available %}
            <p class="mt-3 text-gray-600 dark:text-gray-300">Descarga la aplicación para tu dispositivo Android.</p>
            <a href="{% url 'authentication:apk_download' %}" class="mt-6 inline-flex rounded-lg bg-indigo-600 px-4 py-3 font-semibold text-white hover:bg-indigo-700">
                Descargar APK
            </a>
        {% else %}
            <p class="mt-3 text-gray-600 dark:text-gray-300">El APK aún no está disponible.</p>
        {% endif %}
    </div>
</section>
{% endblock %}
